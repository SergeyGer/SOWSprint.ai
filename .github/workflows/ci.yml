name: CI

# Runs the full test suite and lint on every push and pull request.
#
# The suite is deliberately credential-free: every subsystem resolves to its offline
# adapter, so CI needs no secrets and cannot be broken by a revoked key. That property
# is the whole reason the deterministic engine exists (see docs/adr/0001).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when a newer commit arrives on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tests & lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the production base image; 3.12 is the development interpreter.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src tests app.py scripts

      - name: Test
        # -o addopts="" so the summary line is printed rather than suppressed.
        run: pytest tests/ -o addopts="" -q

      - name: Verify the corpus loads and is balanced
        run: python -m sowsprint.rag.ingest --stats-only

  end-to-end:
    name: End-to-end pipeline (offline engine)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run a full scoping engagement
        # Exercises the whole graph — clarification-free brief, drafting, audit, tool
        # planning, approval, provisioning and PDF/Markdown/CSV rendering — with no
        # network access and no credentials.
        run: python scripts/demo_e2e.py --auto-deploy

      - name: Assert the deliverables were produced
        run: |
          set -euo pipefail
          latest=$(ls -1dt data/artifacts/*/ | head -1)
          echo "artefacts in $latest"
          ls -la "$latest"
          for expected in statement_of_work.pdf statement_of_work.md backlog.md \
                          jira_backlog.csv quality_audit.md run_report.json; do
            test -s "$latest/$expected" || { echo "missing or empty: $expected"; exit 1; }
          done
          # A PDF must actually be a PDF.
          head -c 5 "$latest/statement_of_work.pdf" | grep -q '%PDF-' \
            || { echo "statement_of_work.pdf is not a PDF"; exit 1; }
          echo "all deliverables present"

      - name: Upload deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sow-deliverables
          path: data/artifacts/
          retention-days: 7
          if-no-files-found: warn

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sowsprint/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image is non-root and binds every interface
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id sowsprint/app:ci -u)" != "0" \
            || { echo "container must not run as root"; exit 1; }
          docker run --rm --entrypoint printenv sowsprint/app:ci SOWSPRINT_HOST \
            | grep -qx '0.0.0.0' \
            || { echo "must bind 0.0.0.0 for mobile testing"; exit 1; }
          echo "image checks passed"
