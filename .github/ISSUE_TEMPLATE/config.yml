# Blank issues are disabled: an empty report about a system this size ("it doesn't work")
# costs a round trip to establish which of eight stages, which backend and which provider.
# The two forms ask the questions that make the first reply useful.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/SergeyGer/SOWSprint.ai/security/advisories/new
    about: Report privately. Do not open a public issue for a security problem.
  - name: Documentation and the wiki
    url: https://github.com/SergeyGer/SOWSprint.ai/wiki
    about: Architecture, operations, quality assurance and the honest limitations.
