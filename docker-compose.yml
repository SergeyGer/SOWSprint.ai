# ---------------------------------------------------------------------------
# SOWSprint.ai — multi-service local / production stack
# ---------------------------------------------------------------------------
#   sowsprint-app     Chainlit GUI + LangGraph engine + API integrations
#   sowsprint-qdrant  vector database with a persistent storage volume
#
# Mobile testing note (from the technical brief): the application container binds
# 0.0.0.0 inside the network namespace, and the published port is bound on all host
# interfaces, so an iPhone on the same Wi-Fi can reach the build at
# http://<host-lan-ip>:8000 .
#
# If port 8000 is already taken on your machine, set SOWSPRINT_HOST_PORT in .env —
# the container-internal port stays 8000 either way.

name: sowsprint

services:
  # ------------------------------------------------------------------ vector DB
  sowsprint-qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sowsprint-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: INFO
    ports:
      # Exposed so the host can run ingestion scripts against the same instance.
      - "${SOWSPRINT_QDRANT_HTTP_PORT:-6333}:6333"
      - "${SOWSPRINT_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The Qdrant image ships no curl/wget, so probe the TCP port with bash's
      # /dev/tcp redirection, which the image's shell supports.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - sowsprint-net

  # ------------------------------------------------------------------ application
  sowsprint-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sowsprint/app:2.0.0
    container_name: sowsprint-app
    restart: unless-stopped
    depends_on:
      sowsprint-qdrant:
        condition: service_healthy
    ports:
      # Bound on 0.0.0.0 by default so mobile devices on the LAN can connect.
      - "${SOWSPRINT_HOST_PORT:-8000}:8000"
    # Every SOWSPRINT_* variable in .env is passed straight through. Enumerating them
    # explicitly here silently DROPPED any setting not on the list — adding
    # `SOWSPRINT_CRITIC_PROVIDER` to .env had no effect until the list was edited too.
    # Listing the file instead means new settings work without touching compose.
    env_file:
      - path: .env
        required: false
    environment:
      # ---- forced by the container topology ---------------------------------
      # These must NOT come from .env: they describe how the services address each
      # other inside the bridge network, not how the operator configures the app.
      SOWSPRINT_HOST: "0.0.0.0"
      SOWSPRINT_PORT: "8000"
      SOWSPRINT_VECTOR_BACKEND: "qdrant"
      SOWSPRINT_QDRANT_URL: "http://sowsprint-qdrant:6333"
      # Explicit, so `docker compose exec` inherits the same telemetry default.
      SOWSPRINT_LOG_LEVEL: "${SOWSPRINT_LOG_LEVEL:-INFO}"
      SOWSPRINT_LOG_JSON: "${SOWSPRINT_LOG_JSON:-true}"
    volumes:
      # Deliverables and the cached BM25 statistics survive a container rebuild.
      # bm25_stats.json lives inside this directory, so one volume covers both —
      # mounting a second volume at the same path would shadow the first.
      - artifact_data:/app/data/artifacts
      # Extra compliance corpora (CUAD, in-house clause banks) are dropped into
      # data/corpus/*.json on the host and read here. Mounted rather than copied at
      # build time so an operator can extend the knowledge base without rebuilding,
      # which is what the drop-in directory is for.
      - ./data/corpus:/app/data/corpus:ro
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py", "--url", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - sowsprint-net

volumes:
  qdrant_storage:
    driver: local
  artifact_data:
    driver: local

networks:
  sowsprint-net:
    driver: bridge
