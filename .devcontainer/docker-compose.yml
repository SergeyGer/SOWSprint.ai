# ---------------------------------------------------------------------------
# SOWSprint.ai — compose file for the VS Code development container
# ---------------------------------------------------------------------------
# A separate compose PROJECT (`sowsprint-dev`, not `sowsprint`), and that is the important
# decision in this file.
#
# The scripts in ../scripts are scoped to the compose project `sowsprint`. If the dev
# container joined that project, `./scripts/stop.sh` would take it down — killing the
# container VS Code is attached to, which looks like VS Code crashing rather than like a
# command doing what it was told. Keeping them apart means the two ways of working are
# independent, and `./scripts/status.sh` reports the dev container as another project holding
# the ports, which is exactly what it is.
#
# They cannot run at the same time: both publish 8000, 6333 and 6334. `./scripts/start.sh`
# detects that and names the container in the way, rather than failing with a bind error.

name: sowsprint-dev

services:
  # ------------------------------------------------------------------ vector DB
  # The same image and the same named volume as the production compose file, so the index
  # built while developing is the index the stack uses. Re-ingesting 615 chunks on every
  # switch would make the dev container feel like a punishment.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sowsprint-dev-qdrant
    restart: "no"
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "${SOWSPRINT_QDRANT_HTTP_PORT:-6333}:6333"
      - "${SOWSPRINT_QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sowsprint-dev-net

  # ------------------------------------------------------------------ workspace
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: sowsprint-dev
    restart: "no"
    depends_on:
      qdrant:
        condition: service_healthy
    # The working tree is bind-mounted, so edits made in VS Code are the files the tests and
    # the application read. Nothing is copied.
    volumes:
      - ..:/workspaces/SOWSprint:cached
      # Kept in a named volume so a rebuild does not re-download every wheel.
      - pip-cache:/home/vscode/.cache/pip
      # The host's Docker socket, so `docker` and `docker compose` work from inside the
      # container. Without it the start/stop scripts cannot be exercised from the terminal
      # VS Code opens, which is where anyone would try them.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Inside the compose network the database answers to its service name, so
      # localhost is the wrong address here and the compose file sets it rather than
      # leaving it to .env.
      SOWSPRINT_VECTOR_BACKEND: "qdrant"
      SOWSPRINT_QDRANT_URL: "http://qdrant:6333"
      SOWSPRINT_HOST: "0.0.0.0"
      SOWSPRINT_PORT: "8000"
    # The application port, published so a phone on the same Wi-Fi can reach the build —
    # the same reason the production compose file binds 0.0.0.0.
    ports:
      - "${SOWSPRINT_HOST_PORT:-8000}:8000"
    # Chainlit's file watcher and pytest both behave better with more shared memory than the
    # 64 MB default.
    shm_size: "1gb"
    command: sleep infinity
    networks:
      - sowsprint-dev-net

volumes:
  qdrant_storage:
    # The PRODUCTION compose file's volume, named `<project>_<volume>`. Compose prefixes
    # volumes with the project name, so it is spelled out here to point at the same one.
    name: sowsprint_qdrant_storage
  pip-cache:
    name: sowsprint-dev-pip-cache

networks:
  sowsprint-dev-net:
    name: sowsprint-dev-net
